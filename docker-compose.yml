# ローカル開発用の MySQL と S3 互換ストレージ。
# 照合順序は本番と同じ utf8mb4_ja_0900_as_cs を使う（docs/設計/03_技術選定.md 4.2）。
# MySQL 8 既定の utf8mb4_0900_ai_ci は濁点・半濁点を区別せず、
# 氏名・会社名の検索と重複判定が壊れるため使わない。
services:
  mysql:
    # 本番は RDS の MySQL 8.4。イメージを取得できない環境では MYSQL_TAG=8.0 などで差し替える
    image: mysql:${MYSQL_TAG:-8.4}
    container_name: grant-management-mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_ja_0900_as_cs
      # 日時はすべて UTC で保存する（04_DB論理設計.md）
      - --default-time-zone=+00:00
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: grant_management
      # grant は MySQL の予約語で RDS がマスターユーザー名に使わせないため、
      # 本番に合わせて grant_app にしている
      MYSQL_USER: grant_app
      MYSQL_PASSWORD: password
      TZ: UTC
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 3s
      timeout: 5s
      retries: 30

  # 本番は S3。ローカルは S3 互換の MinIO を使い、同じ SDK・同じ署名付きURLで動かす
  # （docs/設計/03_技術選定.md 4.6）。保存先だけが差し替わる。
  storage:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: grant-management-storage
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: grant
      MINIO_ROOT_PASSWORD: grantgrant
      # ブラウザから直接 PUT するため、開発サーバーのオリジンを許可する
      MINIO_API_CORS_ALLOW_ORIGIN: "http://localhost:3000"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - storage-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 3s
      timeout: 5s
      retries: 30

  # バケットを作るだけの使い捨て。作成済みなら何もしない
  storage-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    container_name: grant-management-storage-init
    depends_on:
      storage:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://storage:9000 grant grantgrant &&
      mc mb --ignore-existing local/grant-management &&
      echo 'bucket ready'
      "

volumes:
  mysql-data:
  storage-data:
